<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>

     <div class="signup-con">
        <h1>
            Sign Up
        </h1>
        <form action="">
            <label for="username">User Name</label> <br>
            <input type="text" placeholder="Enter Your Name" id="username"> <br> <br>

               <label for="email">Email</label> <br>
            <input type="email" placeholder="Enter Your Email" id="email"> <br> <br>

              <label for="pswd">Password</label> <br>
            <input type="password" placeholder="Enter Your Password" id="pswd"> <br> <br>
            
          

        </form>

          <div>
                <button id="signupbtn">Sign Up</button>
                
            </div>
            <p>Already have an account?</p>
             <button id="loginbtn">Go to Login</button>
    </div>
    <script src="index.js" type="module"></script>
</body>
</html>
